[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agtmem"
version = "0.1.0"
description = "Agent memory you own: Markdown on disk, a disposable index, zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Milosz" }]
keywords = [
    "agent",
    "memory",
    "mcp",
    "llm",
    "markdown",
    "sqlite",
    "fts5",
    "retrieval",
    "long-term-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# Deliberately empty. The store must stay readable by a plain text editor and
# the index must stay rebuildable by a bare CPython install, in ten years.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agtmem = "agtmem.cli:main"
# Short alias. `mem` is generic enough to collide with something, so the
# canonical entry point is `agtmem` and this is a convenience.
mem = "agtmem.cli:main"

[project.urls]
Homepage = "https://github.com/willhack-g/agtmem"
Repository = "https://github.com/willhack-g/agtmem"
Issues = "https://github.com/willhack-g/agtmem/issues"
Changelog = "https://github.com/willhack-g/agtmem/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["agtmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
